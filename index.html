<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>心理測驗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>心理測驗</h1>

        <p class="progress-text">
            第 1 題 / 5 題
        </p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <h2 class="question">
            你放假的時候最喜歡？
        </h2>

        <div class="options">

            <button class="option">
                在家追劇
            </button>

            <button class="option">
                和朋友出門
            </button>

            <button class="option">
                打遊戲
            </button>

            <button class="option">
                睡覺
            </button>

        </div>

        <button class="next-btn">
            下一題
        </button>

    </div>

</body>

</html>
