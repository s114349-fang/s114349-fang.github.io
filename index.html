<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastel Toxic Tetris</title>

<style>

body{
    margin:0;
    background:#fffaf5;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,192,203,0.25), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(173,216,230,0.25), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255,228,181,0.2), transparent 25%);
    animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-20px);
    }
}

.game-container{
    display:flex;
    gap:30px;
    align-items:flex-start;
    position:relative;
    z-index:1;
}

.info{
    display:flex;
    flex-direction:column;
    gap:20px;
    background:#fff;
    padding:20px;
    border-radius:20px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
    width:220px;
}

h1,h2,p{
    color:#444;
    margin:0;
}

canvas{
    background:black;
    border:6px solid #ffd6e7;
    border-radius:20px;
    box-shadow:
        0 0 30px rgba(255,182,193,0.4);
    transition:0.12s;
}

button{
    padding:12px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:#ffd6e7;
    color:#444;
    font-size:16px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    background:#ffe5ef;
}

.controls{
    line-height:1.8;
}

/* GAME OVER */

#gameOverScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.game-over-box{
    background:#fffafc;
    padding:40px;
    border-radius:24px;
    text-align:center;
    width:340px;
    box-shadow:
        0 0 40px rgba(255,192,203,0.4);
}

.game-over-box h1{
    color:#ff8fb1;
    margin-bottom:20px;
}

#gameOverTaunt{
    color:#ff8fb1;
    margin:20px 0;
    line-height:1.7;
}

/* 消行特效 */

.flash{
    animation:flash 0.25s;
}

@keyframes flash{
    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:0.3;
        transform:scale(1.03);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* COMBO */

#comboText{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:50px;
    color:#fff;
    opacity:0;
    pointer-events:none;
    text-shadow:
        0 0 20px rgba(255,255,255,0.8);
}

.combo-show{
    animation:comboAnim 0.7s;
}

@keyframes comboAnim{

    0%{
        opacity:0;
        transform:translate(-50%,20px) scale(0.5);
    }

    30%{
        opacity:1;
        transform:translate(-50%,-10px) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-60px) scale(1);
    }
}

/* 嘲諷通知 */

#tauntContainer{
    position:absolute;
    left:100%;
    top:0;
    margin-left:25px;
    width:340px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.taunt-message{
    background:#fff;
    color:#ff8fb1;
    padding:18px;
    border-radius:18px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.1);
    line-height:1.7;
    font-size:15px;
    transform:translateX(50px);
    opacity:0;
    animation:tauntIn 0.4s forwards;
}

@keyframes tauntIn{

    to{
        transform:translateX(0);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="game-container">

    <!-- 左邊資訊 -->

    <div class="info">

        <h2>
            分數：
            <span id="score">0</span>
        </h2>

        <h2>
            Combo：
            <span id="combo">0</span>
        </h2>

        <button id="restartBtn">
            重新開始
        </button>

        <div class="controls">

            <p>⬅ ➡ 移動</p>
            <p>⬇ 快速下降</p>
            <p>⬆ 旋轉</p>

        </div>

    </div>

    <!-- 遊戲 -->

    <div style="position:relative;">

        <h1>Pastel Toxic Tetris</h1>

        <canvas id="tetris"
            width="300"
            height="600"></canvas>

        <div id="comboText"></div>

    </div>

    <!-- 嘲諷通知 -->

    <div id="tauntContainer"></div>

</div>

<!-- GAME OVER -->

<div id="gameOverScreen">

    <div class="game-over-box">

        <h1>GAME OVER</h1>

        <h2>
            分數：
            <span id="finalScore">0</span>
        </h2>

        <p id="gameOverTaunt"></p>

        <button id="restartGameOverBtn">
            再被羞辱一次
        </button>

    </div>

</div>

<script>

const canvas =
    document.getElementById("tetris");

const context =
    canvas.getContext("2d");

context.scale(30,30);

const scoreElement =
    document.getElementById("score");

const comboElement =
    document.getElementById("combo");

const comboText =
    document.getElementById("comboText");

const tauntContainer =
    document.getElementById("tauntContainer");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const finalScore =
    document.getElementById("finalScore");

const gameOverTaunt =
    document.getElementById("gameOverTaunt");

const arena =
    createMatrix(10,20);

const colors = [

    null,

    "#ffd6e0",
    "#d6f0ff",
    "#d6ffe3",
    "#f3d6ff",
    "#ffe8d6",
    "#fff7c7",
    "#d6ddff"

];

const taunts = [

    "你的操作成功避開了所有正確答案。",

    "原來你玩的是『俄羅斯堆垃圾』，失敬失敬。",

    "為了補最底層的一格空缺，你又在上面堆了五層違章建築。",

    "恭喜你成功把這款益智遊戲，玩成了現代行為藝術展。",

    "你不是在消方塊，你是在養地形。",

    "這版面亂到可以拍末日電影。",

    "AI 嘗試理解你的玩法，最後選擇放棄。",

    "你現在缺的不是長條，是奇蹟。",

    "你玩得很自由，完全不受邏輯限制。",

    "這局最大的敵人不是方塊，是你自己。",

    "方塊們正在討論集體辭職。",

    "你這版面連貞子都爬不上來。",

    "你的每一步都像在挑戰人類理解極限。",

    "你現在的操作像是在跟地心引力吵架。",

    "你成功把每個能放好的位置都放成最差答案。"

];

const gameOverTaunts = [

    "辛苦了，這場災難終於結束了。",

    "你真的很努力…在輸。",

    "這局看得我血壓有點高。",

    "方塊終於解脫了。",

    "恭喜你成功餵飽垃圾堆。",

    "再玩下去連方塊都要憂鬱症了。"

];

const player = {

    pos:{x:0,y:0},

    matrix:null,

    score:0,

    combo:0
};

let noClearPieces = 0;

let isGameOver = false;

function createMatrix(w,h){

    const matrix=[];

    while(h--){

        matrix.push(
            new Array(w).fill(0)
        );
    }

    return matrix;
}

function createPiece(type){

    if(type==="T"){

        return [
            [0,0,0],
            [1,1,1],
            [0,1,0]
        ];
    }

    else if(type==="O"){

        return [
            [2,2],
            [2,2]
        ];
    }

    else if(type==="L"){

        return [
            [0,3,0],
            [0,3,0],
            [0,3,3]
        ];
    }

    else if(type==="J"){

        return [
            [0,4,0],
            [0,4,0],
            [4,4,0]
        ];
    }

    else if(type==="I"){

        return [
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0]
        ];
    }

    else if(type==="S"){

        return [
            [0,6,6],
            [6,6,0],
            [0,0,0]
        ];
    }

    else if(type==="Z"){

        return [
            [7,7,0],
            [0,7,7],
            [0,0,0]
        ];
    }
}

function drawMatrix(matrix,offset){

    matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                context.fillStyle =
                    colors[value];

                context.fillRect(
                    x+offset.x,
                    y+offset.y,
                    1,
                    1
                );
            }
        });
    });
}

function draw(){

    context.fillStyle="#000";

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMatrix(arena,{x:0,y:0});

    drawMatrix(
        player.matrix,
        player.pos
    );
}

function merge(arena,player){

    player.matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                arena[
                    y+player.pos.y
                ][
                    x+player.pos.x
                ]=value;
            }
        });
    });
}

function collide(arena,player){

    const [m,o]=[
        player.matrix,
        player.pos
    ];

    for(let y=0;y<m.length;y++){

        for(let x=0;x<m[y].length;x++){

            if(
                m[y][x]!==0 &&
                (
                    arena[y+o.y] &&
                    arena[y+o.y][x+o.x]
                )!==0
            ){

                return true;
            }
        }
    }

    return false;
}

function playerDrop(){

    player.pos.y++;

    if(collide(arena,player)){

        player.pos.y--;

        merge(arena,player);

        playerReset();

        arenaSweep();
    }

    dropCounter=0;
}

function playerMove(dir){

    player.pos.x += dir;

    if(collide(arena,player)){

        player.pos.x -= dir;
    }
}

function rotate(matrix){

    for(let y=0;y<matrix.length;y++){

        for(let x=0;x<y;x++){

            [
                matrix[x][y],
                matrix[y][x]
            ]=[
                matrix[y][x],
                matrix[x][y]
            ];
        }
    }

    matrix.forEach(
        row=>row.reverse()
    );
}

function playerRotate(){

    rotate(player.matrix);

    if(collide(arena,player)){

        rotate(player.matrix);
        rotate(player.matrix);
        rotate(player.matrix);
    }
}

function showTaunt(){

    const text =
        taunts[
            Math.floor(
                Math.random() *
                taunts.length
            )
        ];

    const div =
        document.createElement("div");

    div.classList.add(
        "taunt-message"
    );

    div.innerText = text;

    tauntContainer.appendChild(div);

    while(
        tauntContainer.children.length > 3
    ){

        tauntContainer.removeChild(
            tauntContainer.firstChild
        );
    }
}

function showCombo(){

    comboText.innerText =
        player.combo + " COMBO";

    comboText.classList.remove(
        "combo-show"
    );

    void comboText.offsetWidth;

    comboText.classList.add(
        "combo-show"
    );
}

function arenaSweep(){

    let clearedRows = 0;

    outer:
    for(
        let y=arena.length-1;
        y>0;
        --y
    ){

        for(
            let x=0;
            x<arena[y].length;
            ++x
        ){

            if(arena[y][x]===0){

                continue outer;
            }
        }

        const row =
            arena.splice(y,1)[0].fill(0);

        arena.unshift(row);

        ++y;

        clearedRows++;
    }

    if(clearedRows > 0){

        noClearPieces = 0;

        canvas.classList.add(
            "flash"
        );

        setTimeout(()=>{

            canvas.classList.remove(
                "flash"
            );

        },250);

        player.combo++;

        player.score +=
            player.combo * 10;

        showCombo();

    }else{

        noClearPieces++;

        if(player.combo >= 2){

            showTaunt();
        }

        player.combo = 0;

        if(noClearPieces >= 3){

            showTaunt();

            noClearPieces = 0;
        }
    }

    updateScore();
}

function playerReset(){

    const pieces =
        "ILJOTSZ";

    player.matrix =
        createPiece(
            pieces[
                Math.floor(
                    Math.random() *
                    pieces.length
                )
            ]
        );

    player.pos.y = 0;

    player.pos.x =
        (
            arena[0].length/2|0
        )-
        (
            player.matrix[0].length/2|0
        );

    if(collide(arena,player)){

        showGameOver();
    }
}

function updateScore(){

    scoreElement.innerText =
        player.score;

    comboElement.innerText =
        player.combo;
}

function showGameOver(){

    if(isGameOver){

        return;
    }

    isGameOver = true;

    finalScore.innerText =
        player.score;

    gameOverTaunt.innerText =
        gameOverTaunts[
            Math.floor(
                Math.random() *
                gameOverTaunts.length
            )
        ];

    gameOverScreen.style.display =
        "flex";
}

function restartGame(){

    arena.forEach(
        row=>row.fill(0)
    );

    player.score=0;

    player.combo=0;

    noClearPieces=0;

    isGameOver = false;

    tauntContainer.innerHTML = "";

    updateScore();

    playerReset();

    gameOverScreen.style.display =
        "none";
}

document.addEventListener(
    "keydown",
    event=>{

        if(event.key==="ArrowLeft"){

            playerMove(-1);
        }

        else if(
            event.key==="ArrowRight"
        ){

            playerMove(1);
        }

        else if(
            event.key==="ArrowDown"
        ){

            playerDrop();
        }

        else if(
            event.key==="ArrowUp"
        ){

            playerRotate();
        }
    }
);

document
.getElementById(
    "restartBtn"
)
.addEventListener(
    "click",
    restartGame
);

document
.getElementById(
    "restartGameOverBtn"
)
.addEventListener(
    "click",
    restartGame
);

let dropCounter=0;

let dropInterval=1000;

let lastTime=0;

function update(time=0){

    const deltaTime =
        time-lastTime;

    lastTime=time;

    dropCounter += deltaTime;

    if(dropCounter > dropInterval){

        playerDrop();
    }

    draw();

    requestAnimationFrame(update);
}

playerReset();

updateScore();

update();

</script>

</body>
</html>
