<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastel Tetris</title>

<style>

body{
    margin:0;
    background:#fffaf5;

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    overflow:hidden;
}

.game-container{
    display:flex;
    gap:30px;
    align-items:flex-start;
}

h1,h2,p{
    color:#444;
}

canvas{
    background:black;

    border:6px solid #ffd6e7;

    border-radius:20px;

    box-shadow:
        0 0 30px rgba(255,182,193,0.4);

    transition:0.2s;
}

.info{
    display:flex;
    flex-direction:column;
    gap:20px;

    background:#fff;

    padding:20px;

    border-radius:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
}

button{
    padding:12px;

    font-size:16px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    background:#ffd6e7;

    color:#444;

    transition:0.3s;
}

button:hover{
    transform:scale(1.05);

    background:#ffe5ef;
}

.controls{
    line-height:1.8;
}

/* GAME OVER */

#gameOverScreen{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.7);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.game-over-box{

    background:#fffafc;

    padding:40px;

    border-radius:24px;

    text-align:center;

    width:320px;

    box-shadow:
        0 0 40px rgba(255,192,203,0.4);
}

.game-over-box h1{

    color:#ff8fb1;

    margin-bottom:20px;
}

.game-over-box p{

    font-size:20px;

    margin-bottom:20px;
}

#gameOverTaunt{

    color:#ff8fb1;

    font-size:18px;

    margin-top:10px;

    line-height:1.6;

}

/* 消行特效 */

.flash{

    animation:flash 0.25s;

}

@keyframes flash{

    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:0.2;
        transform:scale(1.02);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

/* 嘲諷通知 */

#taunt{

    position:fixed;

    right:-500px;

    top:40px;

    background:#fff;

    color:#ff8fb1;

    padding:20px 30px;

    border-radius:20px;

    font-size:22px;

    font-weight:bold;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.1);

    transition:0.5s;

    z-index:9999;
}

#taunt.show{

    right:30px;

}

</style>
</head>

<body>

<div class="game-container">

    <div>

        <h1>Pastel Tetris</h1>

        <canvas id="tetris" width="300" height="600"></canvas>

    </div>

    <div class="info">

        <h2>
            分數：
            <span id="score">0</span>
        </h2>

        <button id="restartBtn">
            重新開始
        </button>

        <div class="controls">

            <p>操作方式：</p>

            <p>⬅ ➡ 移動</p>

            <p>⬇ 快速下降</p>

            <p>⬆ 旋轉</p>

        </div>

    </div>

</div>

<!-- GAME OVER -->

<div id="gameOverScreen">

    <div class="game-over-box">

        <h1>GAME OVER</h1>

        <p>
            分數：
            <span id="finalScore">0</span>
        </p>

        <p id="gameOverTaunt"></p>

        <button id="restartGameOverBtn">
            重新開始
        </button>

    </div>

</div>

<!-- 嘲諷通知 -->

<div id="taunt"></div>

<script>

const canvas =
    document.getElementById("tetris");

const context =
    canvas.getContext("2d");

const canvasElement = canvas;

const scoreElement =
    document.getElementById("score");

const restartBtn =
    document.getElementById("restartBtn");

const tauntElement =
    document.getElementById("taunt");

context.scale(30,30);

const arena = createMatrix(10,20);

const colors = [
    null,
    "#ffd6e0",
    "#d6f0ff",
    "#d6ffe3",
    "#f3d6ff",
    "#ffe8d6",
    "#fff7c7",
    "#d6ddff"
];

const taunts = [

    "好菜喔 :D",

    "這操作我看不懂欸（笑）",

    "你是不是閉著眼在玩",

    "我阿嬤都比你強 OuO",

    "再練十年吧少年",

    "方塊看到你都想逃",

    "這都能斷連擊？？",

    "你在堆垃圾山嗎",

    "你是不是把腦袋忘在家",

    "好險方塊不會說話",

    "你的鍵盤快哭了",

    "專心點啦 XD",

    "這手速像阿公泡茶",

    "你是不是在送分",

    "我已經替方塊感到痛苦",

    "求你別再亂放了",

    "這畫面有點慘不忍睹",

    "方塊：我到底做錯了什麼",

    "再這樣玩電腦都要同情你了",

    "你是不是第一次玩 :P"

];

const gameOverTaunts = [

    "結束啦～下去練吧 :D",

    "這分數你也敢秀出來？",

    "我家的貓都玩得比你好",

    "恭喜你成功餵飽垃圾堆",

    "這場打得真有『特色』",

    "辛苦了，下次加油（笑）",

    "你和高手之間差了銀河系",

    "方塊們終於解脫了",

    "看得我血壓有點高",

    "你真的很努力…在輸"

];

const player = {
    pos:{x:0,y:0},
    matrix:null,
    score:0,
    combo:0
};

let noClearPieces = 0;

function createMatrix(w,h){

    const matrix=[];

    while(h--){

        matrix.push(
            new Array(w).fill(0)
        );

    }

    return matrix;
}

function createPiece(type){

    if(type==="T"){

        return [
            [0,0,0],
            [1,1,1],
            [0,1,0]
        ];

    }

    else if(type==="O"){

        return [
            [2,2],
            [2,2]
        ];

    }

    else if(type==="L"){

        return [
            [0,3,0],
            [0,3,0],
            [0,3,3]
        ];

    }

    else if(type==="J"){

        return [
            [0,4,0],
            [0,4,0],
            [4,4,0]
        ];

    }

    else if(type==="I"){

        return [
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0]
        ];

    }

    else if(type==="S"){

        return [
            [0,6,6],
            [6,6,0],
            [0,0,0]
        ];

    }

    else if(type==="Z"){

        return [
            [7,7,0],
            [0,7,7],
            [0,0,0]
        ];

    }

}

function drawMatrix(matrix,offset){

    matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                context.fillStyle =
                    colors[value];

                context.fillRect(
                    x+offset.x,
                    y+offset.y,
                    1,
                    1
                );

            }

        });

    });

}

function draw(){

    context.fillStyle = "#000";

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMatrix(
        arena,
        {x:0,y:0}
    );

    drawMatrix(
        player.matrix,
        player.pos
    );

}

function merge(arena,player){

    player.matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                arena[
                    y+player.pos.y
                ][
                    x+player.pos.x
                ] = value;

            }

        });

    });

}

function collide(arena,player){

    const [m,o]=[
        player.matrix,
        player.pos
    ];

    for(let y=0;y<m.length;y++){

        for(let x=0;x<m[y].length;x++){

            if(
                m[y][x]!==0 &&
                (
                    arena[y+o.y] &&
                    arena[y+o.y][x+o.x]
                )!==0
            ){

                return true;

            }

        }

    }

    return false;
}

function playerDrop(){

    player.pos.y++;

    if(collide(arena,player)){

        player.pos.y--;

        merge(arena,player);

        playerReset();

        arenaSweep();

    }

    dropCounter=0;
}

function playerMove(dir){

    player.pos.x += dir;

    if(collide(arena,player)){

        player.pos.x -= dir;

    }

}

function rotate(matrix){

    for(let y=0;y<matrix.length;y++){

        for(let x=0;x<y;x++){

            [
                matrix[x][y],
                matrix[y][x]
            ] = [
                matrix[y][x],
                matrix[x][y]
            ];

        }

    }

    matrix.forEach(
        row=>row.reverse()
    );

}

function playerRotate(){

    rotate(player.matrix);

    if(collide(arena,player)){

        rotate(player.matrix);
        rotate(player.matrix);
        rotate(player.matrix);

    }

}

function showTaunt(){

    const randomText = taunts[
        Math.floor(
            Math.random()*taunts.length
        )
    ];

    tauntElement.innerText =
        randomText;

    tauntElement.classList.add(
        "show"
    );

    setTimeout(()=>{

        tauntElement.classList.remove(
            "show"
        );

    },2000);

}

function arenaSweep(){

    let clearedRows = 0;

    outer:
    for(
        let y=arena.length-1;
        y>0;
        --y
    ){

        for(
            let x=0;
            x<arena[y].length;
            ++x
        ){

            if(arena[y][x]===0){

                continue outer;

            }

        }

        const row =
            arena.splice(y,1)[0].fill(0);

        arena.unshift(row);

        ++y;

        clearedRows++;

    }

    if(clearedRows > 0){

        noClearPieces = 0;

        canvasElement.classList.add(
            "flash"
        );

        setTimeout(()=>{

            canvasElement.classList.remove(
                "flash"
            );

        },250);

        player.combo++;

        player.score +=
            player.combo * 10;

    }else{

        noClearPieces++;

        if(player.combo >= 2){

            showTaunt();

        }

        player.combo = 0;

        if(noClearPieces >= 5){

            showTaunt();

            noClearPieces = 0;

        }

    }

    updateScore();

}

function playerReset(){

    const pieces="ILJOTSZ";

    player.matrix =
        createPiece(
            pieces[
                Math.floor(
                    Math.random()*
                    pieces.length
                )
            ]
        );

    player.pos.y=0;

    player.pos.x=
        (
            arena[0].length/2|0
        )-
        (
            player.matrix[0].length/2|0
        );

    if(collide(arena,player)){

        showGameOver();

    }

}

function updateScore(){

    scoreElement.innerText =
        player.score;

}

document.addEventListener(
    "keydown",
    event=>{

        if(event.key==="ArrowLeft"){

            playerMove(-1);

        }

        else if(
            event.key==="ArrowRight"
        ){

            playerMove(1);

        }

        else if(
            event.key==="ArrowDown"
        ){

            playerDrop();

        }

        else if(
            event.key==="ArrowUp"
        ){

            playerRotate();

        }

    }
);

restartBtn.addEventListener(
    "click",
    restartGame
);

let dropCounter=0;

let dropInterval=1000;

let lastTime=0;

function update(time=0){

    const deltaTime =
        time-lastTime;

    lastTime=time;

    dropCounter += deltaTime;

    if(dropCounter>dropInterval){

        playerDrop();

    }

    draw();

    requestAnimationFrame(update);

}

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const gameOverTaunt =
    document.getElementById(
        "gameOverTaunt"
    );

const restartGameOverBtn =
    document.getElementById(
        "restartGameOverBtn"
    );

function showGameOver(){

    finalScore.innerText =
        player.score;

    const randomTaunt =
        gameOverTaunts[
            Math.floor(
                Math.random() *
                gameOverTaunts.length
            )
        ];

    gameOverTaunt.innerText =
        randomTaunt;

    gameOverScreen.style.display =
        "flex";

}

function restartGame(){

    arena.forEach(
        row=>row.fill(0)
    );

    player.score=0;

    player.combo=0;

    noClearPieces=0;

    updateScore();

    playerReset();

    gameOverScreen.style.display =
        "none";

}

restartGameOverBtn.addEventListener(
    "click",
    restartGame
);

playerReset();

updateScore();

update();

</script>

</body>
</html>
