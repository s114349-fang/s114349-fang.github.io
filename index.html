<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄羅斯方塊</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.game-container{
    display:flex;
    gap:20px;
    align-items:flex-start;
}

canvas{
    background:black;
    border:4px solid white;
}

.info{
    display:flex;
    flex-direction:column;
    gap:20px;
}

button{
    padding:10px;
    font-size:16px;
    cursor:pointer;
    border:none;
    background:#00bfff;
    color:white;
    border-radius:8px;
}

button:hover{
    background:#009acd;
}

.controls{
    line-height:1.8;
}
</style>
</head>

<body>

<div class="game-container">

    <div>
        <h1>俄羅斯方塊</h1>
        <canvas id="tetris" width="300" height="600"></canvas>
    </div>

    <div class="info">
        <h2>分數：<span id="score">0</span></h2>

        <button id="restartBtn">
            重新開始
        </button>

        <div class="controls">
            <p>操作方式：</p>
            <p>⬅ ➡ 移動</p>
            <p>⬇ 加速下降</p>
            <p>⬆ 旋轉</p>
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById("tetris");
const context = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const restartBtn = document.getElementById("restartBtn");

context.scale(30,30);

const arena = createMatrix(10,20);

const colors = [
    null,
    "#FF0D72",
    "#0DC2FF",
    "#0DFF72",
    "#F538FF",
    "#FF8E0D",
    "#FFE138",
    "#3877FF"
];

const player = {
    pos:{x:0,y:0},
    matrix:null,
    score:0
};

function createMatrix(w,h){
    const matrix=[];

    while(h--){
        matrix.push(new Array(w).fill(0));
    }

    return matrix;
}

function createPiece(type){

    if(type==="T"){
        return [
            [0,0,0],
            [1,1,1],
            [0,1,0]
        ];
    }

    else if(type==="O"){
        return [
            [2,2],
            [2,2]
        ];
    }

    else if(type==="L"){
        return [
            [0,3,0],
            [0,3,0],
            [0,3,3]
        ];
    }

    else if(type==="J"){
        return [
            [0,4,0],
            [0,4,0],
            [4,4,0]
        ];
    }

    else if(type==="I"){
        return [
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0]
        ];
    }

    else if(type==="S"){
        return [
            [0,6,6],
            [6,6,0],
            [0,0,0]
        ];
    }

    else if(type==="Z"){
        return [
            [7,7,0],
            [0,7,7],
            [0,0,0]
        ];
    }
}

function drawMatrix(matrix,offset){

    matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                context.fillStyle=colors[value];

                context.fillRect(
                    x+offset.x,
                    y+offset.y,
                    1,
                    1
                );
            }

        });

    });

}

function draw(){

    context.fillStyle="#000";

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMatrix(arena,{x:0,y:0});
    drawMatrix(player.matrix,player.pos);
}

function merge(arena,player){

    player.matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                arena[y+player.pos.y][x+player.pos.x]=value;

            }

        });

    });

}

function collide(arena,player){

    const [m,o]=[
        player.matrix,
        player.pos
    ];

    for(let y=0;y<m.length;y++){

        for(let x=0;x<m[y].length;x++){

            if(
                m[y][x]!==0 &&
                (
                    arena[y+o.y] &&
                    arena[y+o.y][x+o.x]
                )!==0
            ){
                return true;
            }

        }

    }

    return false;
}

function playerDrop(){

    player.pos.y++;

    if(collide(arena,player)){

        player.pos.y--;

        merge(arena,player);

        playerReset();

        arenaSweep();
    }

    dropCounter=0;
}

function playerMove(dir){

    player.pos.x+=dir;

    if(collide(arena,player)){
        player.pos.x-=dir;
    }

}

function rotate(matrix){

    for(let y=0;y<matrix.length;y++){

        for(let x=0;x<y;x++){

            [
                matrix[x][y],
                matrix[y][x]
            ]=[
                matrix[y][x],
                matrix[x][y]
            ];

        }

    }

    matrix.forEach(row=>row.reverse());

}

function playerRotate(){

    rotate(player.matrix);

    if(collide(arena,player)){

        rotate(player.matrix);
        rotate(player.matrix);
        rotate(player.matrix);

    }

}

function arenaSweep(){

    outer:
    for(let y=arena.length-1;y>0;--y){

        for(let x=0;x<arena[y].length;++x){

            if(arena[y][x]===0){
                continue outer;
            }

        }

        const row=arena.splice(y,1)[0].fill(0);

        arena.unshift(row);

        ++y;

        player.score+=10;

    }

    updateScore();

}

function playerReset(){

    const pieces="ILJOTSZ";

    player.matrix=createPiece(
        pieces[
            Math.floor(
                Math.random()*pieces.length
            )
        ]
    );

    player.pos.y=0;

    player.pos.x=
        (
            arena[0].length/2|0
        )-
        (
            player.matrix[0].length/2|0
        );

    if(collide(arena,player)){

        arena.forEach(
            row=>row.fill(0)
        );

        player.score=0;

        updateScore();

    }

}

function updateScore(){
    scoreElement.innerText=player.score;
}

document.addEventListener("keydown",event=>{

    if(event.key==="ArrowLeft"){
        playerMove(-1);
    }

    else if(event.key==="ArrowRight"){
        playerMove(1);
    }

    else if(event.key==="ArrowDown"){
        playerDrop();
    }

    else if(event.key==="ArrowUp"){
        playerRotate();
    }

});

restartBtn.addEventListener("click",()=>{

    arena.forEach(
        row=>row.fill(0)
    );

    player.score=0;

    updateScore();

    playerReset();

});

let dropCounter=0;

let dropInterval=1000;

let lastTime=0;

function update(time=0){

    const deltaTime=time-lastTime;

    lastTime=time;

    dropCounter+=deltaTime;

    if(dropCounter>dropInterval){
        playerDrop();
    }

    draw();

    requestAnimationFrame(update);

}

playerReset();

updateScore();

update();
</script>

</body>
</html>
