<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>心理測驗</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#e9e9e9;
    font-family:"Microsoft JhengHei", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:700px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.progress{
    width:150px;
    height:12px;
    margin-bottom:50px;
    align-self:flex-end;
}

.progress-fill{
    width:20%;
    height:100%;
    background:black;
    border-radius:20px;
}

.question-box{
    width:430px;
    min-height:100px;

    background:white;

    border-radius:25px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:32px;

    padding:20px;

    margin-bottom:40px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.option{
    width:250px;
    height:65px;

    border:none;

    border-radius:25px;

    background:white;

    font-size:18px;

    cursor:pointer;
}

.option:hover{
    background:#f5f5f5;
}

.result{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
}

.restart-btn{
    width:200px;
    height:60px;

    border:none;

    border-radius:25px;

    background:black;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.restart-btn:hover{
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-box" id="question">
        題目
    </div>

    <div class="options">

        <button class="option" onclick="selectAnswer(0)">
            選項1
        </button>

        <button class="option" onclick="selectAnswer(1)">
            選項2
        </button>

        <button class="option" onclick="selectAnswer(2)">
            選項3
        </button>

        <button class="option" onclick="selectAnswer(3)">
            選項4
        </button>

    </div>

</div>

<script>

const questions = [

{
    question:"走在路上，看到對面有一個可能認識的人但不確定是不是，你會？",
    options:["大喊他的名字然後大幅度用力揮手","無視，然後掏出隨身攜帶的被子隨地大小睡","和朋友說:你好~","原地召喚飛碟然後飛起來逃跑"]
},

{
    question:"聽說明天是世界末日，你今天要做什麼?",
    options:["去跟你的好朋朋坦白你是同，而且喜歡他很久了","都最後一天了，當然要把握時間睡覺阿","和太陽開心的說:再見~","前往宇宙調查世界末日的原因並阻止"]
},

{
    question:"朋友約你出去時？",
    options:["可是我想在家打遊戲欸不要","不行我要睡覺。","蛤~~~~~~~~~","說我要去阻止世界末日，沒辦法跟你出去玩"]
},

{
    question:"你覺得你是？",
    options:["我不是人!","可以冬眠的動物","蛤~~~~~~~~~~","我乃神明大人，區區賤民還不跪下!"]
},

{
    question:"今天好無聊，要幹嘛?？",
    options:["到處騷擾朋友直到被罵有病然後很爽的離開","睡覺阿廢話，老子昨天敖通宵ㄟ","出去玩~出去玩~出去玩~出去玩~","和外星人討論艱深的哲學問題"]
}

];

let currentQuestion = 0;

let scores = [0,0,0,0];

const questionBox =
document.getElementById("question");

const optionButtons =
document.querySelectorAll(".option");

const progressFill =
document.getElementById("progressFill");

function loadQuestion(){

    questionBox.textContent =
    questions[currentQuestion].question;

    optionButtons.forEach((button,index)=>{

        button.textContent =
        questions[currentQuestion].options[index];

    });

    progressFill.style.width =
    ((currentQuestion + 1) / questions.length * 100) + "%";
}

function selectAnswer(choice){

    scores[choice]++;

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        showResult();

    }

}

function showResult(){

    const resultNames = [

        "怪怪的人",

        "很睏的人",

        "天線寶寶",

        "你不是人"

    ];

    const resultIndex =
    scores.indexOf(Math.max(...scores));

    document.querySelector(".container").innerHTML = `

        <div class="result">

            <h1>測驗完成！</h1>

            <br>

            <h2>我覺得最適合你的形容是：</h2>

            <br>

            <h1>${resultNames[resultIndex]}</h1>

            <br><br>

            <button
                class="restart-btn"
                onclick="restartQuiz()">

                重新測驗

            </button>

        </div>

    `;

}

function restartQuiz(){

    location.reload();

}

loadQuestion();

</script>

</body>
</html>
