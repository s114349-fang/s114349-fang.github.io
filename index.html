<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘲諷版俄羅斯方塊</title>

<style>

body{
    margin:0;
    background:#fffaf5;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,192,203,0.25), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(173,216,230,0.25), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255,228,181,0.2), transparent 25%);
    animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-20px);
    }
}

.game-container{
    display:flex;
    gap:30px;
    align-items:flex-start;
    position:relative;
}

.info{
    display:flex;
    flex-direction:column;
    gap:20px;
    background:#fff;
    padding:20px;
    border-radius:20px;
    width:220px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

canvas{
    background:black;
    border:6px solid #ffd6e7;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,182,193,0.4);
}

#next{
    width:120px;
    height:120px;
    align-self:center;
}

button{
    padding:12px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:#ffd6e7;
    font-size:16px;
}

button:hover{
    background:#ffe5ef;
}

#comboText{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:50px;
    opacity:0;
    pointer-events:none;
}

.combo-show{
    animation:comboAnim 0.7s;
}

@keyframes comboAnim{
    0%{
        opacity:0;
        transform:translate(-50%,20px) scale(0.5);
    }
    30%{
        opacity:1;
        transform:translate(-50%,-10px) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-60px) scale(1);
    }
}

.flash{
    animation:flash 0.25s;
}

@keyframes flash{
    0%{
        opacity:1;
    }
    50%{
        opacity:0.3;
    }
    100%{
        opacity:1;
    }
}

#tauntContainer{
    position:absolute;
    left:100%;
    top:0;
    margin-left:20px;
    width:340px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.taunt-message{
    background:white;
    padding:15px;
    border-radius:16px;
    color:#ff8fb1;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    line-height:1.6;
    animation:slideIn 0.4s;
}

@keyframes slideIn{
    from{
        transform:translateX(40px);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

#startScreen,
#gameOverScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#gameOverScreen{
    display:none;
}

.popup{
    background:#fffafc;
    padding:40px;
    border-radius:24px;
    text-align:center;
    width:360px;
}

.popup h1{
    color:#ff8fb1;
}

.controls{
    line-height:2;
    margin:20px 0;
}

</style>
</head>

<body>

<div id="startScreen">

    <div class="popup">

        <h1>嘲諷版俄羅斯方塊</h1>

        <p>你準備好被方塊羞辱了嗎？</p>

        <div class="controls">

            <p>⬅ ➡ 移動</p>
            <p>⬆ 旋轉</p>
            <p>⬇ 快速下降</p>

        </div>

        <button id="startBtn">
            開始受苦
        </button>

    </div>

</div>

<div class="game-container">

    <div class="info">

        <h2>
            分數：
            <span id="score">0</span>
        </h2>

        <h2>
            Combo：
            <span id="combo">0</span>
        </h2>

        <h3>Next</h3>

        <canvas id="next"
            width="120"
            height="120"></canvas>

        <button id="restartBtn">
            重新開始
        </button>

    </div>

    <div style="position:relative;">

        <h1>嘲諷版俄羅斯方塊</h1>

        <canvas id="tetris"
            width="300"
            height="600"></canvas>

        <div id="comboText"></div>

    </div>

    <div id="tauntContainer"></div>

</div>

<div id="gameOverScreen">

    <div class="popup">

        <h1>GAME OVER</h1>

        <h2>
            分數：
            <span id="finalScore">0</span>
        </h2>

        <p id="gameOverTaunt"></p>

        <button id="restartGameOverBtn">
            再被羞辱一次
        </button>

    </div>

</div>

context.scale(30,30);

nextContext.scale(30,30);

const gameOverTaunt =

const scoreElement =

const gameOverTaunts = [

"辛苦了，這場災難終於結束了。",

"你真的很努力…在輸。",

"這局看得我血壓有點高。",

"方塊終於解脫了。"
];

const player = {

    pos:{x:0,y:0},

    matrix:null,

    score:0,

    combo:0,

    comboClearLastTurn:false
};

let nextPiece = null;

let noClearPieces = 0;

let isGameOver = false;

let animationId;

function createMatrix(w,h){

    const matrix=[];

    while(h--){

        matrix.push(
            new Array(w).fill(0)
        );
    }

    return matrix;
}

function createPiece(type){

    if(type==="T") return [
        [0,0,0],
        [1,1,1],
        [0,1,0]
    ];

    if(type==="O") return [
        [2,2],
        [2,2]
    ];

    if(type==="L") return [
        [0,3,0],
        [0,3,0],
        [0,3,3]
    ];

    if(type==="J") return [
        [0,4,0],
        [0,4,0],
        [4,4,0]
    ];

    if(type==="I") return [
        [0,5,0,0],
        [0,5,0,0],
        [0,5,0,0],
        [0,5,0,0]
    ];

    if(type==="S") return [
        [0,6,6],
        [6,6,0],
        [0,0,0]
    ];

    if(type==="Z") return [
        [7,7,0],
        [0,7,7],
        [0,0,0]
    ];
}

function randomPiece(){

    const pieces="ILJOTSZ";

    return createPiece(
        pieces[
            Math.floor(
                Math.random()*pieces.length
            )
        ]
    );
}

function drawMatrix(matrix,offset,ctx){

    matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                ctx.fillStyle=colors[value];

                ctx.fillRect(
                    x+offset.x,
                    y+offset.y,
                    1,
                    1
                );
            }
        });
    });
}

function drawGhost(){

    const ghost = {

        pos:{
            x:player.pos.x,
            y:player.pos.y
        },

        matrix:player.matrix
    };

    while(
        !collide(arena,ghost)
    ){
        ghost.pos.y++;
    }

    ghost.pos.y--;

    ghost.matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                context.globalAlpha=0.25;

                context.fillStyle="#fff";

                context.fillRect(
                    x+ghost.pos.x,
                    y+ghost.pos.y,
                    1,
                    1
                );

                context.globalAlpha=1;
            }
        });
    });
}

function draw(){

    context.fillStyle="#000";

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMatrix(arena,{x:0,y:0},context);

    drawGhost();

    drawMatrix(
        player.matrix,
        player.pos,
        context
    );
}

function drawNext(){

    nextContext.fillStyle="#000";

    nextContext.fillRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );

    const offsetX =
        (4-nextPiece[0].length)/2;

    const offsetY =
        (4-nextPiece.length)/2;

    drawMatrix(
        nextPiece,
        {
            x:offsetX,
            y:offsetY
        },
        nextContext
    );
}

function merge(arena,player){

    player.matrix.forEach((row,y)=>{

        row.forEach((value,x)=>{

            if(value!==0){

                arena[
                    y+player.pos.y
                ][
                    x+player.pos.x
                ]=value;
            }
        });
    });
}

function collide(arena,player){

    const [m,o]=[
        player.matrix,
        player.pos
    ];

    for(let y=0;y<m.length;y++){

        for(let x=0;x<m[y].length;x++){

            if(
                m[y][x]!==0 &&
                (
                    arena[y+o.y] &&
                    arena[y+o.y][x+o.x]
                )!==0
            ){

                return true;
            }
        }
    }

    return false;
}

function playerDrop(){

    if(isGameOver) return;

    player.pos.y++;

    if(collide(arena,player)){

        player.pos.y--;

        merge(arena,player);

        playerReset();

        arenaSweep();
    }

    dropCounter=0;
}

function playerMove(dir){

    player.pos.x += dir;

    if(collide(arena,player)){

        player.pos.x -= dir;
    }
}

function rotate(matrix){

    for(let y=0;y<matrix.length;y++){

        for(let x=0;x<y;x++){

            [
                matrix[x][y],
                matrix[y][x]
            ]=[
                matrix[y][x],
                matrix[x][y]
            ];
        }
    }

    matrix.forEach(
        row=>row.reverse()
    );
}

function playerRotate(){

    rotate(player.matrix);

    if(collide(arena,player)){

        rotate(player.matrix);
        rotate(player.matrix);
        rotate(player.matrix);
    }
}

function showCombo(){

    if(player.combo <= 0) return;

    comboText.innerText =
        player.combo + " COMBO";

    comboText.classList.remove(
        "combo-show"
    );

    void comboText.offsetWidth;

    comboText.classList.add(
        "combo-show"
    );
}

function showTaunt(){

    const div =
        document.createElement("div");

    div.classList.add(
        "taunt-message"
    );

    div.innerText =
        taunts[
            Math.floor(
                Math.random()*taunts.length
            )
        ];

    tauntContainer.appendChild(div);

    while(
        tauntContainer.children.length > 5
    ){

        tauntContainer.removeChild(
            tauntContainer.firstChild
        );
    }
}

function arenaSweep(){

    let clearedRows=0;

    outer:
    for(
        let y=arena.length-1;
        y>0;
        --y
    ){

        for(
            let x=0;
            x<arena[y].length;
            ++x
        ){

            if(arena[y][x]===0){

                continue outer;
            }
        }

        const row =
            arena.splice(y,1)[0].fill(0);

        arena.unshift(row);

        ++y;

        clearedRows++;
    }

    if(clearedRows>0){

        noClearPieces=0;

        canvas.classList.add("flash");

        setTimeout(()=>{

            canvas.classList.remove("flash");

        },250);

        let addScore = 0;

        for(let i=1;i<=clearedRows;i++){

            addScore += i * 10;
        }

        if(player.comboClearLastTurn){

            player.combo++;

        }else{

            player.combo = 0;
        }

        player.comboClearLastTurn = true;

        let comboBonus = 0;

        for(let i=1;i<=player.combo;i++){

            comboBonus += i * 100;
        }

        addScore += comboBonus;

        player.score += addScore;

        showCombo();

    }else{

        noClearPieces++;

        if(player.combo>=2){

            showTaunt();
        }

        player.combo=0;

        player.comboClearLastTurn=false;

        if(noClearPieces>=3){

            showTaunt();

            noClearPieces=0;
        }
    }

    updateScore();
}

function playerReset(){

    if(nextPiece===null){

        nextPiece=randomPiece();
    }

    player.matrix=nextPiece;

    nextPiece=randomPiece();

    drawNext();

    player.pos.y=0;

    player.pos.x=
        (
            arena[0].length/2|0
        )-
        (
            player.matrix[0].length/2|0
        );

    if(collide(arena,player)){

        showGameOver();
    }
}

function updateScore(){

    scoreElement.innerText=
        player.score;

    comboElement.innerText=
        player.combo;
}

function showGameOver(){

    if(isGameOver) return;

    isGameOver=true;

    cancelAnimationFrame(animationId);

    finalScore.innerText=
        player.score;

    gameOverTaunt.innerText=
        gameOverTaunts[
            Math.floor(
                Math.random()*
                gameOverTaunts.length
            )
        ];

    gameOverScreen.style.display=
        "flex";
}

function restartGame(){

    arena.forEach(
        row=>row.fill(0)
    );

    player.score=0;

    player.combo=0;

    player.comboClearLastTurn=false;

    noClearPieces=0;

    isGameOver=false;

    tauntContainer.innerHTML="";

    nextPiece=null;

    updateScore();

    playerReset();

    gameOverScreen.style.display=
        "none";

    lastTime=0;

    dropCounter=0;

    animationId=
        requestAnimationFrame(update);
}

document.addEventListener(
    "keydown",
    event=>{

        if(!gameStarted) return;

        if(event.key==="ArrowLeft"){

            playerMove(-1);
        }

        else if(event.key==="ArrowRight"){

            playerMove(1);
        }

        else if(event.key==="ArrowDown"){

            playerDrop();
        }

        else if(event.key==="ArrowUp"){

            playerRotate();
        }
    }
);

document
.getElementById("restartBtn")
.addEventListener(
    "click",
    restartGame
);

document
.getElementById("restartGameOverBtn")
.addEventListener(
    "click",
    restartGame
);

document
.getElementById("startBtn")
.addEventListener(
    "click",
    ()=>{

        document
        .getElementById("startScreen")
        .style.display="none";

        gameStarted=true;

        playerReset();

        updateScore();

        animationId=
            requestAnimationFrame(update);
    }
);

let dropCounter=0;

let dropInterval=1000;

let lastTime=0;

function update(time=0){

    if(isGameOver) return;

    const deltaTime =
        time-lastTime;

    lastTime=time;

    dropCounter += deltaTime;

    if(dropCounter > dropInterval){

        playerDrop();
    }

    draw();

    animationId=
        requestAnimationFrame(update);
}

</script>

</body>
</html>
