<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>心理測驗</title>

<style>
body{
    background:#e9e9e9;
    font-family:"Microsoft JhengHei";
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:700px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.question-box{
    width:430px;
    height:100px;
    background:white;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    margin-bottom:40px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.option{
    width:250px;
    height:65px;
    border:none;
    border-radius:25px;
    background:white;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

    <div class="question-box">
        題目
    </div>

    <div class="options">
        <button class="option">選項1</button>
        <button class="option">選項2</button>
        <button class="option">選項3</button>
        <button class="option">選項4</button>
    </div>

</div>

<script>
console.log("心理測驗開始");
</script>

</body>
</html>
